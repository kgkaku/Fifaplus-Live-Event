name: FIFA+ Live Stream Fetcher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install yt-dlp
        run: pip install yt-dlp
      - name: Run fetcher
        run: python fifaplus.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fifaplus-streams
          path: |
            fifaplus.json
            fifaplus.m3u
