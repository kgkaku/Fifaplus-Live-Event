name: FIFA+ Live Stream Fetcher

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install curl and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl
        pip install --upgrade pip
        pip install requests pywidevine==1.8.0
    
    - name: Run FIFA+ scraper
      env:
        PAT_TOKEN_CDM: ${{ secrets.PAT_TOKEN_CDM }}
      run: python fifaplus.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fifaplus-streams
        path: |
          fifaplus.json
          fifaplus.m3u
        retention-days: 7
