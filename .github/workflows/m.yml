name: FIFA+ Live Stream Fetcher

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests pywidevine
    
    - name: Run FIFA+ scraper
      env:
        PAT_TOKEN_CDM: ${{ secrets.PAT_TOKEN_CDM }}   # ← এটা থাকতে হবে
      run: python fifaplus.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fifaplus-streams
        path: |
          fifaplus.json
          fifaplus.m3u
