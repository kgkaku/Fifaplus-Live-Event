name: FIFA+ Live Stream Fetcher

on:
  schedule:
    - cron: '0 * * * *'  # প্রতি ঘন্টায়
  workflow_dispatch:  # ম্যানুয়াল রানের জন্য

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests pywidevine
    
    - name: Run FIFA+ scraper
      env:
        CDM_REPO_TOKEN: ${{ secrets.CDM_REPO_TOKEN }}
      run: python fifaplus.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fifaplus-streams
        path: |
          fifaplus.json
          fifaplus.m3u
        retention-days: 7
